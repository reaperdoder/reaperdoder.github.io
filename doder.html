<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Plumber Clone</title>
<style>
  body {
    margin: 0;
    background: #5c94fc;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: linear-gradient(#5c94fc, #a0d0ff);
  }
  .controls {
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
  }
  .btn {
    width: 70px;
    height: 70px;
    background: rgba(0,0,0,0.4);
    border-radius: 50%;
    color: white;
    font-size: 24px;
    text-align: center;
    line-height: 70px;
    user-select: none;
    pointer-events: auto;
  }
</style>
</head>
<body>

<canvas id="game" width="800" height="450"></canvas>

<div class="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div>
    <div class="btn" id="jump">⤒</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.6;
const FLOOR = 380;

const keys = { left:false, right:false, jump:false };

const player = {
  x: 50,
  y: FLOOR,
  w: 32,
  h: 32,
  vx: 0,
  vy: 0,
  speed: 3,
  jumping: false
};

const platforms = [
  {x:0,y:FLOOR+32,w:2000,h:50},
  {x:200,y:300,w:120,h:20},
  {x:400,y:250,w:120,h:20},
  {x:650,y:200,w:120,h:20}
];

function update() {
  // movimento
  if (keys.left) player.vx = -player.speed;
  else if (keys.right) player.vx = player.speed;
  else player.vx = 0;

  if (keys.jump && !player.jumping) {
    player.vy = -12;
    player.jumping = true;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // collisioni
  platforms.forEach(p => {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y < p.y + p.h &&
      player.y + player.h > p.y
    ) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.jumping = false;
      }
    }
  });

  if (player.y > FLOOR) {
    player.y = FLOOR;
    player.vy = 0;
    player.jumping = false;
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle = "#ff3333";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // platforms
  ctx.fillStyle = "#8b4513";
  platforms.forEach(p => ctx.fillRect(p.x,p.y,p.w,p.h));
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* TOUCH CONTROLS */
function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener("touchstart", e => { keys[key]=true; e.preventDefault(); });
  el.addEventListener("touchend", e => { keys[key]=false; e.preventDefault(); });
}

bindTouch("left","left");
bindTouch("right","right");
bindTouch("jump","jump");

/* GAMEPAD */
function pollGamepad() {
  const gp = navigator.getGamepads()[0];
  if (gp) {
    keys.left = gp.axes[0] < -0.3;
    keys.right = gp.axes[0] > 0.3;
    keys.jump = gp.buttons[0].pressed;
  }
  requestAnimationFrame(pollGamepad);
}
pollGamepad();

/* CHIPTUNE MUSIC (ORIGINAL) */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playMusic() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = 440;
  gain.gain.value = 0.05;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  setTimeout(()=>osc.stop(), 200);
  setTimeout(playMusic, 400);
}
document.body.addEventListener("touchstart", ()=>audioCtx.resume(), {once:true});
setTimeout(playMusic, 1000);
</script>
</body>
</html>
