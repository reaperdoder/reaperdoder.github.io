<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Recursive Tree Fractal</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0f172a;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const maxDepth = 10;
const baseLength = canvas.height * 0.25;
const angleSpread = Math.PI / 6;
const shrinkFactor = 0.72;

let growth = 0;
let growing = true;
let windTime = 0;

// Recursive draw
function drawBranch(x, y, length, angle, depth, sway) {
  if (depth === 0) return;

  const endX = x + length * Math.cos(angle + sway);
  const endY = y + length * Math.sin(angle + sway);

  ctx.lineWidth = Math.max(1, depth * 0.7);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(endX, endY);
  ctx.strokeStyle = `hsl(${100 + depth * 5}, 40%, 60%)`;
  ctx.stroke();

  const nextLength = length * shrinkFactor * growth;
  const randomOffset = (Math.random() - 0.5) * 0.1;

  drawBranch(
    endX,
    endY,
    nextLength,
    angle - angleSpread + randomOffset,
    depth - 1,
    sway * 1.3
  );

  drawBranch(
    endX,
    endY,
    nextLength,
    angle + angleSpread + randomOffset,
    depth - 1,
    sway * 1.3
  );
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height);
  ctx.strokeStyle = "#a3e635";

  let sway = 0;
  if (!growing) {
    windTime += 0.01;
    sway = Math.sin(windTime) * 0.03;
  }

  drawBranch(
    0,
    0,
    baseLength * growth,
    -Math.PI / 2,
    maxDepth,
    sway
  );

  ctx.restore();

  if (growing) {
    growth += 0.01;
    if (growth >= 1) {
      growth = 1;
      growing = false;
    }
  }

  requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
